services:
  web:
    build: .
    ports:
      - "8081:3000"
    volumes:
      - ./db:/usr/src/app/db
      - ./uploads:/usr/src/app/uploads
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      - HTTPS_ENFORCE=false   # DNS(HTTPS) + 로컬 IP(HTTP) 둘 다 허용. 외부엔 NPMplus가 HSTS 등 자체 추가.
    restart: always